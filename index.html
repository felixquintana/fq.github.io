<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BladeRunner Tech News</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Exo+2:wght@300;400;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header class="header">
            <div class="header-content">
                <h1 class="logo">
                    <span class="logo-blade">BLADE</span>
                    <span class="logo-runner">RUNNER</span>
                    <span class="logo-subtitle">TECH NEWS</span>
                </h1>
                <div class="header-line"></div>
                <p class="tagline">Noticias del futuro tecnológico</p>
            </div>
            <div class="last-update">
                <span id="last-update-text">Última actualización: <span id="update-time"></span></span>
            </div>
        </header>

        <main class="main-content">
            <div class="news-grid" id="news-container">
                <!-- Las noticias se cargarán aquí dinámicamente -->
            </div>
        </main>

        <footer class="footer">
            <div class="footer-content">
                <p>&copy; 2025 BladeRunner Tech News. Powered by AI.</p>
                <div class="footer-links">
                    <a href="#" class="footer-link">Acerca de</a>
                    <a href="#" class="footer-link">Contacto</a>
                    <a href="#" class="footer-link">RSS</a>
                </div>
            </div>
        </footer>
    </div>

    <div class="background-grid"></div>
    <div class="background-particles"></div>

    <script src="script.js"></script>
</body>
</html>
